[workspace]
resolver = "2"
members = [
    "crates/proofline-core",
    "crates/proofline-intelligence",
    "crates/proofline-sandbox",
    "crates/proofline-cpg",
    "crates/proofline-analysis",
    "crates/proofline-fuzzer",
    "crates/proofline-differential",
    "crates/proofline-supplychain",
    "crates/proofline-ai",
    "crates/proofline-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Proofline Engineering Team <architect@proofline.dev>"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"
blake3 = "1.5"
tempfile = "3.13"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = { version = "0.11", default-features = false }
ed25519-dalek = "3.0"
serde_jcs = "0.4"
getrandom = "0.4"
clap = { version = "4.6", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-c = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
