[workspace]
resolver = "2"
members = [
    "crates/proofline-core",
    "crates/proofline-intelligence",
    "crates/proofline-sandbox",
    "crates/proofline-cpg",
    "crates/proofline-analysis",
    "crates/proofline-fuzzer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Proofline Engineering Team <architect@proofline.dev>"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"
blake3 = "1.5"
tempfile = "3.13"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
